name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rodio plays the typing sounds through ALSA on Linux.
      - name: Install the ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Lint without typing sounds
        run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test --all-targets --locked

  msrv:
    name: Build with the minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cargo reads the version from Cargo.toml, whatever its TOML syntax,
      # so the check follows the manifest.
      - name: Read the minimum Rust version
        id: msrv
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "keeper") | .rust_version // empty')
          test -n "$version" || { echo "Cargo.toml has no rust-version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked
