[package]
name = "keeper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal typing tutor ported from keybr.com"
license = "AGPL-3.0-or-later"
readme = "README.md"
default-run = "keeper"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
ratatui = "0.30"
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-width = "0.2"

[features]
default = ["sound"]
# Typing sounds, played with the system audio output.
sound = ["dep:rodio"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
